name: Test order integration

on:
  push:
    paths:
      - '.github/workflows/test-order.yml'

jobs:
  test-order:
    runs-on: ubuntu-latest
    steps:
      - name: Post test order to production API
        shell: bash
        run: |
          set -euo pipefail
          body='{"name":"CHATGPT TEST","contact":"test@example.com","design":"Bro Bit on the Fake","size":"Adult Large","color":"Black","quantity":"1","fulfillment":"Local Pickup","notes":"Automated integration test"}'
          http_code=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST "https://tater-totz-tees.vercel.app/api/order" \
            -H "Content-Type: application/json" \
            --data "$body")
          echo "HTTP $http_code"
          cat response.txt
          echo
          test "$http_code" = "200"
          grep -q '"ok":true' response.txt
